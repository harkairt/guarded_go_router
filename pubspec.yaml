    sdk: flutter
  flutter_hooks: ^0.21.2
  go_router: ^15.1.1
  hooks_riverpod: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  lint: ^2.1.2
  mocktail: ^1.0.1
